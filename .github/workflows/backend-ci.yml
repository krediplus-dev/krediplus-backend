name: Verificar backend

on:
  push:
    branches: [main, debug]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: credicash_test
          POSTGRES_USER: credicash_test
          POSTGRES_PASSWORD: credicash_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credicash_test -d credicash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/credicash_test
      TEST_DB_USER: credicash_test
      TEST_DB_PASSWORD: credicash_test_password
    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ejecutar pruebas y construir JAR
        run: ./gradlew --no-daemon --console=plain test buildFatJar

      - name: Construir imagen Docker
        run: docker build --tag credicash-backend:ci .

      - name: Publicar reporte de pruebas fallidas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-pruebas-backend
          path: build/reports/tests/test
          if-no-files-found: ignore
